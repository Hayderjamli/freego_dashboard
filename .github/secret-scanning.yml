# GitHub Advanced Security: Secret Scanning Allowlist
# Context: Firebase web API keys are not secrets. FlutterFire generates
# firebase_options.dart which contains public client identifiers.
# This configuration prevents false-positive alerts for that file/patterns.

allowlist:
  description: "Allow Firebase web/client API keys in generated options file"
  # Exclude specific files that legitimately contain public keys
  paths:
    - lib/firebase_options.dart
  # Optional: ignore typical Firebase client-side key patterns
  # These patterns match public client identifiers and measurement IDs
  regexes:
    - "AIza[0-9A-Za-z-_]{35}"
    - "[0-9]{1,}:[0-9A-Za-z]{1,}:(web|ios|android):[0-9a-f]{24}"
    - "G-[A-Z0-9]{8,}"
